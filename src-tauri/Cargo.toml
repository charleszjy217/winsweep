[package]
name = "winsweep"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "WinSweep — Windows 磁盘垃圾扫描与安全清理工具 · 暗色极客风便携清理工具"
authors = ["在心flow"]
license = "MIT"

[lib]
name = "winsweep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rayon = "1"
trash = "5"
notify = "8"

# 说明：按架构 §6.1 原本规划使用 windows = "0.62"。
# 为规避 windows crate 版本间签名差异导致的编译不确定性（以及进一步压缩体积），
# win/shell.rs 改为直接以 `extern "system"` 绑定 shell32 / kernel32（语义与 Win32 API
# 完全一致），故此处不引入 windows crate。该决定已在交付摘要中记录。
# 同理，时间戳改由 std::time 手写 RFC3339（架构 §6.1 已允许“为省体积可改手写”），
# 不引入 chrono。

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false
